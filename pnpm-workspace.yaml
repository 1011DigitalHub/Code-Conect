packages:
  - "apps/*"
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: false
  prisma: true
# Audit fixes for transitive dependencies of the Prisma CLI (prisma@7.10.0 pins the
# vulnerable versions). Neither is used at runtime: the API talks to PostgreSQL through
# @prisma/adapter-pg. Remove these when a stable Prisma release bumps them.
overrides:
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0
