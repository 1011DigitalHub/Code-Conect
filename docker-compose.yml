services:
  postgres:
    image: postgres:18-alpine
    container_name: code-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-codeconnect}
    ports:
      # Only reachable from this machine, not from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is created empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: code-connect-pgdata
