services:
  postgres:
    image: postgres:18-alpine
    container_name: code-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-codeconnect}
    ports:
      # Only reachable from this machine, not from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is created empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # The two hardened production images (apps/api/Dockerfile,
  # apps/web/Dockerfile). Not needed for day-to-day development — `pnpm
  # dev` against `pnpm db:up`'s postgres is faster — this is for building
  # and smoke-testing the actual deployable images locally
  # (`docker compose up api web`). DATABASE_URL points at the `postgres`
  # service by its compose network name, not `localhost`: inside a
  # container, `localhost` is the container itself, not the host or a
  # sibling service.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: code-connect-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeconnect}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-codeconnect}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (min. 32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Login social via OIDC (plan/LoginSocial.md) — the Google/Microsoft
      # credentials below are optional: leave them unset and the api service
      # still boots fine, the social buttons just redirect back to /login
      # with a generic error (see OidcController.start) — the password form
      # on the same page still works. OIDC_LINKING_TOKEN_SECRET is NOT optional —
      # apps/api's own env.ts requires it in production unconditionally
      # (it is cheap to generate and a wrong default is a real
      # account-linking forgery risk the moment OIDC credentials ARE set),
      # so this fails the same way JWT_SECRET does rather than letting the
      # container crash-loop on an empty one with a less obvious cause.
      API_ORIGIN: ${VITE_API_URL:-http://localhost:3000}
      # CORS_ORIGINS can be a comma-separated list; WEB_APP_ORIGIN must be
      # exactly one origin (the callback redirects the browser to it), so
      # this is its own var rather than reusing that one.
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      OIDC_LINKING_TOKEN_SECRET: ${OIDC_LINKING_TOKEN_SECRET:?defina OIDC_LINKING_TOKEN_SECRET no .env (min. 32 caracteres) — obrigatório mesmo sem configurar OIDC}
    ports:
      # Only reachable from this machine, like postgres above.
      - '127.0.0.1:3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time: Vite inlines this into the bundle, so it must be the
        # browser-reachable API URL, not the compose network name above.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: code-connect-web
    restart: unless-stopped
    depends_on:
      # Not just "api exists": nginx otherwise starts serving a frontend
      # whose API is still connecting to Prisma on a cold start. The
      # HEALTHCHECK both images declare (see their Dockerfiles) is what
      # compose reads to know the difference — no separate `healthcheck:`
      # block here, so the two can't drift apart.
      api:
        condition: service_healthy
    environment:
      # Run-time: substituted into the CSP by nginx at container start
      # (apps/web/default.conf.template) — same value, different stage.
      API_ORIGIN: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:8080:8080'

  mcp-docs:
    build:
      context: ./docker/mcp
      dockerfile: Dockerfile
    container_name: code-connect-mcp-docs
    restart: unless-stopped
    volumes:
      # Read-only: container nunca modifica os docs clonados.
      - ./docker/mcp/docs:/docs:ro
    stdin_open: true
    tty: false

volumes:
  pgdata:
    name: code-connect-pgdata
