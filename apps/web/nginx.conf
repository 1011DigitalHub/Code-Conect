worker_processes auto;
# A non-root user can't write to the default locations under /var — these
# redirect nginx's own runtime state into /tmp, which the Dockerfile makes
# writable by the nginx user.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Hides the nginx version from the Server header (Information
  # Disclosure) — the only thing a request needs to know is that *a* server
  # answered, not which one or what version.
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # default.conf.template (templates/) is envsubst'd into conf.d/ by the
  # official image's own docker-entrypoint.sh at container start.
  include /etc/nginx/conf.d/*.conf;
}
