name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review re-triggers when a draft is promoted, preserving the
    # claude-review behaviour the previous standalone claude.yml had.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.6.0
  NODE_VERSION: 22

jobs:
  # ── Scope detection ───────────────────────────────────────────────────────────
  # Classifies changed files into known scopes (api, web, core, docs) and
  # computes the effective flags used by every downstream job. All rules:
  #
  #   D2 — non-PR events (push to main, workflow_dispatch) always run full suite.
  #   D3 — core files (package.json, lockfile, workflow files) trigger full suite.
  #   D3 — unclassified files (nothing matched) trigger full suite (fail-closed).
  #
  # docs-lint always gates on `docs == 'true'` and is never in the needs of
  # stages 2 or 3 — a markdown style error must not delay test feedback.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API (listFiles) on PR events and
    # needs pull-requests: read to do so. The workflow-level `contents: read`
    # is too narrow; job-level permissions override it for this job only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api:        ${{ steps.scope.outputs.api }}
      web:        ${{ steps.scope.outputs.web }}
      docs:       ${{ steps.scope.outputs.docs }}
      full:       ${{ steps.scope.outputs.full }}
      docs_files: ${{ steps.filter.outputs.docs_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 is enough for paths-filter to diff HEAD against its parent
          # on push events; PR events use the base ref supplied by the GH API.
          fetch-depth: 2

      # Classify changed files. `list-files: shell` emits a shell-safe
      # list of changed docs paths for the docs-lint job.
      # Note: dorny/paths-filter v3 does not apply negative (!) patterns to
      # the boolean result when list-files is set — using a catch-all
      # `unclassified: ['**', '!...']` filter always returns true because `**`
      # matches every file before negations are considered. Unclassified
      # detection is therefore handled in the shell script below instead.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          list-files: shell
          filters: |
            api:
              - 'apps/api/**'
              - 'prisma/**'
            web:
              - 'apps/web/**'
            core:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
            docs:
              - '**/*.md'

      - name: Compute scope and write step summary
        id: scope
        env:
          F_API:  ${{ steps.filter.outputs.api }}
          F_WEB:  ${{ steps.filter.outputs.web }}
          F_CORE: ${{ steps.filter.outputs.core }}
          F_DOCS: ${{ steps.filter.outputs.docs }}
          EVENT:  ${{ github.event_name }}
        run: |
          # D2 + D3: full suite for non-PR events, core file changes, or
          # anything that fell outside every known scope (unclassified files).
          # Unclassified = no known scope matched on a PR event (fail-closed).
          UNCLASSIFIED=false
          if [[ "$F_API" == "false" && "$F_WEB" == "false" && "$F_DOCS" == "false" && "$F_CORE" == "false" && "$EVENT" == "pull_request" ]]; then
            UNCLASSIFIED=true
          fi

          if [[ "$EVENT" != "pull_request" || "$F_CORE" == "true" || "$UNCLASSIFIED" == "true" ]]; then
            FULL=true
          else
            FULL=false
          fi

          [[ "$F_API" == "true" || "$FULL" == "true" ]] && API=true  || API=false
          [[ "$F_WEB" == "true" || "$FULL" == "true" ]] && WEB=true  || WEB=false

          {
            echo "full=$FULL"
            echo "api=$API"
            echo "web=$WEB"
            echo "docs=$F_DOCS"
          } >> "$GITHUB_OUTPUT"

          # Step summary: one-line table so the decision is visible in the UI.
          if   [[ "$FULL" == "true" && "$EVENT" != "pull_request" ]]; then
            REASON="non-PR event — full suite"
          elif [[ "$FULL" == "true" && "$F_CORE" == "true" ]]; then
            REASON="core files changed — full suite"
          elif [[ "$FULL" == "true" ]]; then
            REASON="unclassified files (no known scope matched) — full suite (fail-closed)"
          else
            REASON="path filter"
          fi

          {
            echo "## CI scope"
            echo ""
            echo "| Scope | Will run |"
            echo "|-------|----------|"
            echo "| API (lint · typecheck · unit · e2e-api) | $API |"
            echo "| Web (lint · typecheck · unit · e2e-web · Lighthouse) | $WEB |"
            echo "| Docs lint | $F_DOCS |"
            echo ""
            echo "_${REASON}_"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 1: static analysis ──────────────────────────────────────────────────
  static-api:
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm lint:api

      - run: pnpm typecheck:api

  static-web:
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm lint:web

      - run: pnpm typecheck:web

  # Dead code and duplication checks (Knip + jscpd). Non-blocking: knip runs
  # with --no-exit-code and jscpd with continue-on-error until thresholds are
  # validated. Promote to blocking once the codebase is clean.
  static-quality:
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Dead code check (Knip)
        run: pnpm knip --no-exit-code --reporter compact
        continue-on-error: true

      - name: Copy-paste detection (jscpd)
        run: pnpm cpd
        continue-on-error: true

  # Intentionally NOT included in the `needs:` of stages 2 or 3. A markdown
  # style error must not delay test feedback on code changes. Only `ci-gate`
  # waits for this job (see plan/OtimizacaoPipelineCI.md, approved point 2).
  docs-lint:
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint changed markdown files
        # docs_files is a shell-quoted list from dorny/paths-filter
        # (list-files: shell). No pnpm install needed: npx fetches the tool.
        run: npx markdownlint-cli2@0.17.2 ${{ needs.changes.outputs.docs_files }}

  # ── Claude code review ─────────────────────────────────────────────────────────
  # Runs only after stage 1 succeeds so tokens are never spent on code that
  # fails lint or typecheck. Inherits the ci.yml concurrency group (a new push
  # to the PR cancels an in-flight review — accepted trade-off, approved
  # point 3 in plan/OtimizacaoPipelineCI.md).
  claude-review:
    needs: [changes, static-api, static-web]
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && !failure() && !cancelled() && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    # The called claude.yml defines pull-requests: write and id-token: write at
    # the job level. GitHub validates that the calling job grants at least those
    # permissions before starting any jobs (startup_failure otherwise). The
    # workflow-level `permissions: contents: read` is too narrow for this job.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/claude.yml
    secrets: inherit

  # ── Stage 2: unit and component tests ─────────────────────────────────────────
  # Both jobs depend on BOTH static-api AND static-web so that a failure in
  # either scope aborts the other (cross-app fail-fast). A skipped job has
  # result "skipped", not "failure", so failure() stays false for out-of-scope
  # runs and scope isolation is preserved.
  unit-api:
    needs: [changes, static-api, static-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm test:api

  component-web:
    needs: [changes, static-api, static-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm test:web

  # ── Stage 3: e2e, browser suites and metrics ──────────────────────────────────
  # The API e2e suite exercises configureApp (helmet, body limit, CORS, rate
  # limiting) and the full cookie/CSRF auth flow against a real Postgres db.
  e2e-api:
    needs: [changes, unit-api, component-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codeconnect
          POSTGRES_PASSWORD: codeconnect-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://codeconnect:codeconnect-ci-only@localhost:5432/codeconnect
      TEST_DATABASE_URL: postgresql://codeconnect:codeconnect-ci-only@localhost:5432/codeconnect_test
      # CI-only, never a real secret: the e2e suite needs 32+ characters
      # (see src/env.ts) and nothing about this value is sensitive.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-32-chars-minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The dev/test databases themselves (docker-compose.yml's
      # docker/postgres/init/ only runs for that local setup); migrations are
      # applied by test/global-setup.ts against TEST_DATABASE_URL.
      - name: Create the databases
        run: |
          PGPASSWORD=codeconnect-ci-only psql -h localhost -U codeconnect -d postgres \
            -c "CREATE DATABASE codeconnect;" \
            -c "CREATE DATABASE codeconnect_test;"

      - run: pnpm test:api:e2e

  # The browser suite (a11y + security headers), against the production build
  # — same as Lighthouse CI, but for correctness/a11y instead of scores.
  e2e-web:
    needs: [changes, unit-api, component-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    # Safety net against a webServer teardown hang (see playwright.config.ts),
    # which would otherwise run until the runner's default 6-hour timeout.
    # Sized well above the work rather than close to it: the suite itself takes
    # ~2 minutes, but `playwright install --with-deps` has been measured at
    # 9m34s on a cold runner — it apt-installs the browser's system libraries —
    # which alone exhausted the previous 10-minute budget.
    timeout-minutes: 25
    # "/" is the public feed, so playwright.config.ts starts the real API
    # alongside the preview server — which needs a database behind it. Auditing
    # an empty or error state would not measure the page this project ships.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codeconnect
          POSTGRES_PASSWORD: codeconnect-ci-only
          # Explicit, though it is also what POSTGRES_DB would default to from
          # POSTGRES_USER. The entrypoint creates it, so this job needs no
          # CREATE DATABASE step of its own.
          POSTGRES_DB: codeconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # NODE_ENV is deliberately NOT set here: `pnpm test:web:a11y` runs
      # `vite build`, which reads it, and a job-level value bundles React's
      # development build (576 kB instead of 347 kB) — the suite would then
      # audit something users never get. The API needs it, so it is set on that
      # process alone, in playwright.config.ts's webServer env. "test" rather
      # than "production" there keeps cookies non-Secure, which the http
      # preview origin needs, and lets src/cors.ts default to the Vite origins.
      DATABASE_URL: postgresql://codeconnect:codeconnect-ci-only@localhost:5432/codeconnect
      # CI-only, never a real secret: src/env.ts requires 32+ characters.
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-32-chars-minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Built here rather than chained into playwright.config.ts's webServer,
      # so the command it supervises is a plain `node dist/main.js` it can
      # actually tree-kill on teardown.
      - name: Build the API the browser suites run against
        run: pnpm --filter api build

      - name: Apply migrations and seed the feed the suites audit
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm db:seed

      # Cache the Playwright browser binary to avoid re-downloading it on each
      # run. The apt system libraries (the slow part, ~9 min) cannot be cached
      # here, so `install-deps` still runs on a cache hit; only the browser
      # binary download is skipped.
      - name: Read Playwright version for cache key
        id: pw-version
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install the browser Playwright drives (new headless Chromium)
        working-directory: apps/web
        run: |
          if [[ "${{ steps.pw-cache.outputs.cache-hit }}" == "true" ]]; then
            # Browser binary already in cache; only install system libraries.
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - run: pnpm test:web:a11y

  # Lighthouse is called as a reusable workflow so it participates in the
  # fail-fast stage gating. Only triggers when web files changed (D1 in
  # plan/OtimizacaoPipelineCI.md: an API-only change does not affect LCP).
  lighthouse:
    needs: [changes, unit-api, component-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web == 'true' }}
    uses: ./.github/workflows/lighthouse.yml
    secrets: inherit

  # BundleMon comments bundle-size delta on PRs. Requires the BundleMon GitHub
  # App to be installed on the repository (manual step — see
  # plan/GuardrailsMinimalismo.md). Non-blocking: the step runs with
  # continue-on-error: true until the App is installed and limits are validated.
  bundlemon:
    needs: [changes, unit-api, component-web]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Build web app
        run: pnpm build:web

      - name: Bundle size check (BundleMon)
        run: npx bundlemon@2.1.0
        continue-on-error: true
        env:
          BUNDLEMON_PROJECT_ID: ${{ secrets.BUNDLEMON_PROJECT_ID }}
          BUNDLEMON_PROJECT_APIKEY: ${{ secrets.BUNDLEMON_PROJECT_APIKEY }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_TARGET_BRANCH: ${{ github.base_ref }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}

  # ── Gate: the only required check ─────────────────────────────────────────────
  # Configure this job as the single required status check in GitHub's branch
  # protection settings for `main`. Because out-of-scope jobs are "skipped"
  # (not "failure"), they do not block the merge — the gate handles that.
  # Manual setup required: replace any existing per-job required checks with
  # this single `ci-gate` check (see plan/OtimizacaoPipelineCI.md, point 1).
  ci-gate:
    needs:
      - changes
      - static-api
      - static-web
      - static-quality
      - docs-lint
      - claude-review
      - unit-api
      - component-web
      - e2e-api
      - e2e-web
      - lighthouse
      - bundlemon
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        env:
          STATIC_API:     ${{ needs.static-api.result }}
          STATIC_WEB:     ${{ needs.static-web.result }}
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          DOCS_LINT:      ${{ needs.docs-lint.result }}
          CLAUDE_REVIEW: ${{ needs.claude-review.result }}
          UNIT_API:      ${{ needs.unit-api.result }}
          COMPONENT_WEB: ${{ needs.component-web.result }}
          E2E_API:       ${{ needs.e2e-api.result }}
          E2E_WEB:       ${{ needs.e2e-web.result }}
          LIGHTHOUSE:    ${{ needs.lighthouse.result }}
          BUNDLEMON:     ${{ needs.bundlemon.result }}
        run: |
          declare -A jobs=(
            [static-api]="$STATIC_API"
            [static-web]="$STATIC_WEB"
            [static-quality]="$STATIC_QUALITY"
            [docs-lint]="$DOCS_LINT"
            [claude-review]="$CLAUDE_REVIEW"
            [unit-api]="$UNIT_API"
            [component-web]="$COMPONENT_WEB"
            [e2e-api]="$E2E_API"
            [e2e-web]="$E2E_WEB"
            [lighthouse]="$LIGHTHOUSE"
            [bundlemon]="$BUNDLEMON"
          )
          # Only "failure" is a hard stop. "cancelled" is intentionally
          # excluded: when concurrency cancel-in-progress supersedes this
          # run with a newer one, every queued job lands as "cancelled"
          # with no "failure" ancestor — treating that as a gate failure
          # would permanently red-light the PR until a manual re-run. A
          # job cancelled because its *dependency* failed always has a
          # "failure" result on that dependency, which this loop catches
          # independently; the downstream "cancelled" adds no information.
          failed=false
          for name in "${!jobs[@]}"; do
            result="${jobs[$name]}"
            printf '%-20s %s\n' "$name:" "$result"
            if [[ "$result" == "failure" ]]; then
              echo "::error::$name $result"
              failed=true
            fi
          done
          [[ "$failed" == "true" ]] && exit 1 || echo "All jobs passed or were skipped."
