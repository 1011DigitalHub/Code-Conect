name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request seguindo as convenções descritas no
            CLAUDE.md deste repositório (regras REST, autenticação/segurança,
            Prisma, atomic design no apps/web, acessibilidade WCAG 2.2 AA,
            Tailwind sem valores arbitrários, documentação Swagger, testes
            obrigatórios por componente/endpoint), com foco em:
            - Corretude e bugs potenciais
            - Segurança (autenticação, validação de entrada, segredos, CORS)
            - Aderência às convenções específicas deste projeto
            - Cobertura de testes para o que foi alterado

            A branch do PR já está disponível no diretório de trabalho atual.

            Use `gh pr comment` para feedback geral.
            Use `mcp__github_inline_comment__create_inline_comment` (com
            `confirmed: true`) para apontar problemas em linhas específicas.
            Poste apenas comentários no GitHub - não devolva o texto da
            revisão como mensagem de saída.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 5
