version: 2
updates:
  # "npm" is the ecosystem name for the whole npm/yarn/pnpm family — there is
  # no "pnpm" value, and Dependabot refuses to parse the file if one is used,
  # so it reads pnpm-lock.yaml under this name.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor/patch bumps across the monorepo land as one PR instead of
      # dozens; a major bump (e.g. the next Prisma release) still gets its
      # own PR, since those need a human to read the changelog.
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
