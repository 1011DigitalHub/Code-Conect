$kind: http-request
method: GET
url: '{{baseUrl}}/auth/me'
order: 3000
description: >-
  Sem header de Authorization: a sessão é só o cookie access_token que o
  Login acima deixou no jar do Postman (precisa de localhost na allowlist de
  cookies — ver a descrição da coleção).
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('retorna o usuário logado com 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('nunca inclui a senha ou o hash', function () {
        pm.expect(pm.response.text()).to.not.match(/password/i);
      });
