$kind: http-request
method: GET
url: '{{baseUrl}}/'
order: 500
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('responde com 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('envia os headers do helmet', function () {
        pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff');
        pm.expect(pm.response.headers.get('X-Frame-Options')).to.exist;
        pm.expect(pm.response.headers.get('Strict-Transport-Security')).to.exist;
        pm.expect(pm.response.headers.has('X-Powered-By')).to.be.false;
      });
