$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "MariaJulia2@exemplo.com",
      "password": "senha-segura-1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.environment.set("token", json.accessToken);
      }
